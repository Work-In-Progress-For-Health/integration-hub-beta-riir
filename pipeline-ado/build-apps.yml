# Build every Rust service, or a chosen subset.
#
# The Python's equivalent runs a code-quality stage PER APP — sixteen of
# them — because each app is a separate Python package with its own
# dependency set. This workspace is one Cargo workspace, so the gate of
# spec/17-testing-and-quality.md §1 runs ONCE and every build depends on
# it. That is not a shortcut: a change to a shared crate is checked
# against every crate that uses it, which per-app stages could not do.
#
# Manual trigger only. The per-service definitions
# (`hl7serverrust-build.yml` and its siblings) are what the branch
# triggers use; this one exists for a coordinated rebuild of everything.

trigger: none
pr: none

parameters:
  - name: SEMANTIC_VERSION
    displayName: 'Semantic Version'
    type: string
    default: 'v0.1.0'

  - name: appsToBuild
    displayName: 'Apps to build (leave all checked for full build)'
    type: object
    default:
      - 'HL7 Server'
      - 'HL7 Sender'
      - 'HL7 Subscription Sender'
      - 'HL7 SOAP Server'
      - 'HL7 REST Server'
      - 'REST Server'
      - 'HL7 Phw Transformer'
      - 'HL7 Chemo Transformer'
      - 'HL7 Pims Transformer'
      - 'HL7 Mock Receiver'
      - 'HL7 Topic Mock Receiver'
      - 'HL7 WDS Transformer'
      - 'HL7 LIMS WRRS Transformer'
      - 'Database Sender'
      - 'HL7 Core Reference Transformer'
      - 'Message Store Service'
      - 'Message Replay Job'
      - 'Dashboard'
      - 'SOAP Sender'
      - 'SOAP Subscription Sender'
      - 'HTTP Mock Receiver'
      - 'XML FHIR PROMs Transformer'
      - 'Bus Watch'

variables:
  acrName: 'uksdhcwihsharedcr'
  azureServiceConnection: 'Azure - NHSWales-DHCW-IntegrationHub-Subscription'
  POOL_NAME: 'UKS-DHCW-IH-DEV-ADOManagedPool'

stages:
  - stage: CodeQuality
    displayName: 'Code Quality & Tests — Whole Workspace'
    jobs:
      - template: templates/code-quality-template.yml
        parameters:
          jobName: 'CodeQualityWorkspace'
          appDisplayName: 'Whole Workspace'
          poolName: ${{ variables.POOL_NAME }}

  - ${{ if containsValue(parameters.appsToBuild, 'HL7 Server') }}:
    - stage: BuildAndPush_hl7server
      displayName: 'Build — HL7 Server'
      dependsOn: CodeQuality
      jobs:
        - template: templates/docker-build-push-template.yml
          parameters:
            jobName: 'BuildPushHl7Server'
            displayName: 'Build and Push HL7 Server'
            appName: 'hl7server'
            dockerfilePath: 'docker/Dockerfile'
            buildContext: '.'
            buildArgs: 'BIN=hl7-server'
            acrName: $(acrName)
            azureServiceConnection: $(azureServiceConnection)
            POOL_NAME: ${{ variables.POOL_NAME }}
            SEMANTIC_VERSION: ${{ parameters.SEMANTIC_VERSION }}
  - ${{ if containsValue(parameters.appsToBuild, 'HL7 Sender') }}:
