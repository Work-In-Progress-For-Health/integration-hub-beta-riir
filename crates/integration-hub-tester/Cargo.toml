[package]
name = "integration-hub-tester"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Developer tool: runs one message through one Integration Hub component's logic, with no Service Bus, and shows what it would produce."

[lib]
name = "integration_hub_tester"
path = "src/lib.rs"

[[bin]]
name = "integration-hub-tester"
path = "src/bin/integration-hub-tester.rs"

[dependencies]
hl7-2.workspace = true
hl7-2-soap.workspace = true
hl7-core-reference-transformer = { version = "0.1", path = "../hl7-core-reference-transformer" }
hl7-chemo-transformer = { version = "0.1", path = "../hl7-chemo-transformer" }
hl7-pims-transformer = { version = "0.1", path = "../hl7-pims-transformer" }
hl7-phw-transformer.workspace = true
hl7-rest-server.workspace = true
hl7-sender.workspace = true
hl7-server.workspace = true
hl7-soap-server = { version = "0.1", path = "../hl7-soap-server" }
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ihb-bus.workspace = true
ihb-fields.workspace = true
ihb-sender.workspace = true
ihb-transformer.workspace = true
ihb-validation.workspace = true
serde_json.workspace = true
soap-sender = { version = "0.1", path = "../soap-sender" }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
wrds-service.workspace = true
xml-fhir-proms-transformer = { version = "0.1", path = "../xml-fhir-proms-transformer" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros"] }

[lints]
workspace = true
