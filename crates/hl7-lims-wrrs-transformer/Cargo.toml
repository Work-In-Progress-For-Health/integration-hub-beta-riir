ihb-health.workspace = true
ihb-runtime.workspace = true
ihb-telemetry.workspace = true
ihb-tls.workspace = true
ihb-transformer.workspace = true
ihb-validation.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio-test.workspace = true

[lints]
