[package]
name = "rest-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The REST ingress: SOAP or plain XML to Service Bus (generic), or the HL7 REST pipeline (hl7)."

[lib]
name = "rest_server"
path = "src/lib.rs"

[[bin]]
name = "rest-server"
path = "src/main.rs"

[dependencies]
hl7-2.workspace = true
hl7-rest-server.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ihb-bus.workspace = true
ihb-config.workspace = true
ihb-fields.workspace = true
ihb-health.workspace = true
ihb-runtime.workspace = true
ihb-telemetry.workspace = true
ihb-tls.workspace = true
ihb-validation.workspace = true
roxmltree.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio-test.workspace = true

[lints]
workspace = true
