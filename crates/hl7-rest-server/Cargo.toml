[package]
name = "hl7-rest-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The REST HL7 ingress: JSON carrying ER7 or v2.xml in, a raw HL7 ACK out; RISP fan-out to MPI and WRRS."

[lib]
name = "hl7_rest_server"
path = "src/lib.rs"

[[bin]]
name = "hl7-rest-server"
path = "src/main.rs"

[dependencies]
hl7-2.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ihb-bus.workspace = true
ihb-config.workspace = true
ihb-fields.workspace = true
ihb-runtime.workspace = true
ihb-telemetry.workspace = true
ihb-tls.workspace = true
ihb-validation.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-rustls.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio-test.workspace = true

[lints]
workspace = true
