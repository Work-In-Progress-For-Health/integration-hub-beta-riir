[package]
name = "fhir-sender"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "FHIR egress: delivers message Bundles to Promptly with the asynchronous $process-message pattern, and completes them only on a non-error OperationOutcome."

[lib]
name = "fhir_sender"
path = "src/lib.rs"

[[bin]]
name = "fhir-sender"
path = "src/main.rs"

[dependencies]
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ihb-bus.workspace = true
ihb-config.workspace = true
ihb-health.workspace = true
ihb-runtime.workspace = true
ihb-telemetry.workspace = true
ihb-tls.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }
tokio-rustls.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-test.workspace = true

[lints]
workspace = true
