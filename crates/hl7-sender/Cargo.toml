[package]
name = "hl7-sender"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "MLLP egress: delivers a message to a downstream system over a long-lived connection and completes it only on a positive acknowledgement."

[lib]
name = "hl7_sender"
path = "src/lib.rs"

[[bin]]
name = "hl7-sender"
path = "src/bin/hl7-sender.rs"

[[bin]]
name = "hl7-subscription-sender"
path = "src/bin/hl7-subscription-sender.rs"

[dependencies]
hl7-2.workspace = true
hl7-2-mllp.workspace = true
ihb-bus.workspace = true
ihb-config.workspace = true
ihb-fields.workspace = true
ihb-health.workspace = true
ihb-runtime.workspace = true
ihb-sender.workspace = true
ihb-telemetry.workspace = true
ihb-validation.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-test.workspace = true

[lints]
workspace = true
