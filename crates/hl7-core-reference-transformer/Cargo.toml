[package]
name = "hl7-core-reference-transformer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The core reference transformer (RISP to MPI): translates six coded PID fields between code systems through WRDS, over the shared transformer runtime."

[lib]
name = "hl7_core_reference_transformer"
path = "src/lib.rs"

[[bin]]
name = "hl7-core-reference-transformer"
path = "src/main.rs"

[dependencies]
hl7-2.workspace = true
ihb-bus.workspace = true
ihb-config.workspace = true
ihb-fields.workspace = true
ihb-transformer.workspace = true
ihb-validation.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tracing.workspace = true
wrds-service.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
