# Words clippy's `doc_markdown` lint must not read as unbackticked code
# items. These are product and organisation names that appear throughout the
# documentation as prose; backticking them would be wrong.
doc-valid-idents = [
  "ChemoCare",
  "BusWatch",
  "SoapUI",
  "OpenTelemetry",
  "PostgreSQL",
  "XPath",
  "XPaths",
  "NCName",
  "..",
]

# --- checked arithmetic (`rust-checked-arithmetic` RCA-ENF-2) --------------
# What bypasses checking. `cargo xtask check-arithmetic` (spec/17 §2.4) bans
# the `saturating_*` / `wrapping_*` / `overflowing_*` methods and `clamp`,
# which no lint covers; these are the rest of RCA-ENF-2 that Clippy can see.
# `Option::unwrap_or_default` (RCA-P-3) is not banned yet: about a hundred
# uses read "absent is empty" for text, and each needs a declaration first
# (docs/checked-arithmetic-audit.md).
disallowed-methods = [
  { path = "core::iter::Iterator::sum", reason = "RCA-AGG-1: use try_fold with checked_add" },
  { path = "core::iter::Iterator::product", reason = "RCA-AGG-1: use try_fold with checked_mul" },
  { path = "core::time::Duration::from_secs_f64", reason = "RCA-TIME-2: use try_from_secs_f64" },
  { path = "core::time::Duration::from_secs_f32", reason = "RCA-TIME-2: use try_from_secs_f32" },
  { path = "std::time::Instant::duration_since", reason = "RCA-TIME-1: it saturates to zero; use checked_duration_since" },
  { path = "std::time::Instant::saturating_duration_since", reason = "RCA-INT-4: no saturation" },
  { path = "tokio::time::Instant::duration_since", reason = "RCA-TIME-1: it saturates to zero; use checked_duration_since" },
  { path = "tokio::time::Instant::saturating_duration_since", reason = "RCA-INT-4: no saturation" },
]
disallowed-types = [
  { path = "core::num::Saturating", reason = "RCA-INT-4: no saturation" },
  { path = "core::num::Wrapping", reason = "RCA-INT-4: no wrapping" },
]
