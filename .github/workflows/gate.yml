# The gate of spec/17-testing-and-quality.md §1, plus §9's extra jobs.
#
# Three jobs, deliberately separate:
#
#   gate      — §1, on every push and pull request (§9.1).
#   msrv      — §1.4, against the *declared* toolchain rather than a
#               version pinned a second time here.
#   emulator  — §9.2, the tests that need a broker and a database.
#
# They are separate because they fail for different reasons and a reader
# should not have to work out which. An MSRV break is a dependency raising
# its floor; an emulator break is usually a service that did not come up.
#
# §9.4: a merge with a failing gate is not possible. That is enforced by a
# branch protection rule on `gate`, not by this file — a workflow cannot
# make itself required.

name: gate

on:
  push:
  pull_request:

# A new push supersedes an in-flight run of the same ref. The emulator job
# binds fixed host ports, so two concurrent runs on one runner would fight
# over 5672 and 1433.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A build that warns is a build that fails (§1).
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gate (spec/17 §1)
    runs-on: ubuntu-latest
    # spec/21 §8.3 — one run hung for about six hours before it was
    # cancelled. This job takes about six minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # §1's order, cheapest first, so a failure arrives as fast as it can.
      #
      # §1.0: `cargo xtask fmt-check`, NOT `cargo fmt --all` — `--all`
      # reaches beyond this workspace. The task also fails if its member
      # list has drifted from the manifest's, which is how a newly added
      # crate gets noticed.
      - run: cargo xtask fmt-check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Without `--all-features`: the emulator and sqlserver features need
      # services this job does not have. They run in `emulator` below.
      - run: cargo test --workspace

      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The XSD-derived dictionaries are generated and committed; this
      # fails if the committed form no longer matches the source.
      - run: cargo xtask verify-dictionaries

      # spec/18 §6.6 — a new service without a build definition never
      # ships, and nothing else notices.
      - run: cargo xtask verify-pipelines

      - run: cargo deny check

  msrv:
    name: MSRV (spec/17 §1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Stable first, only to run `cargo xtask msrv`.
      - uses: dtolnay/rust-toolchain@stable

      # §1.4 — the toolchain is read from the declaration rather than
      # pinned a second time here. A version written in this file would
      # drift from `[workspace.package] rust-version` and the drift would
      # be invisible until somebody looked.
      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(cargo xtask msrv)" >> "$GITHUB_OUTPUT"

      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # `check`, not `test`: §1.4 is about the floor compiling. Running the
      # suite twice buys nothing and doubles the wall clock.
      - name: Build against the declared MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets

  emulator:
    name: emulator-backed (spec/17 §9.2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The first run that got past the Podman socket died here, partway
      # through the test build, with "No space left on device" on the
      # runner itself: the stack's images plus an all-features build of 34
      # crates outgrow the free disk of a standard runner. These toolchains
      # are preinstalled, large, and used by nothing in this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # `local/.secrets` is not committed. The password is a local-stack
      # credential for a container that exists for the length of this job
      # and is reachable only from it.
      - name: Write the local stack's secret
        run: |
          printf 'MSSQL_SA_PASSWORD=%s\n' "${{ secrets.MSSQL_SA_PASSWORD || 'CI-only-Passw0rd!' }}" \
            > local/.secrets

      # spec/21 §8.1 — this job failed in every run inspected here, at the
      # next step, with "failed to connect to the docker API at
      # unix:///run/user/1001/podman/podman.sock". `podman compose` hands
      # the work to the runner's Docker Compose plugin, which talks to
      # Podman over its API socket, and nothing had started that service:
      # a runner has no user systemd session to socket-activate it.
      #
      # `podman system service` with no address listens on exactly the
      # default path the error names, so no DOCKER_HOST needs setting.
      - name: Start Podman's API service
        run: |
          podman system service --time=0 &
          for _ in $(seq 1 30); do
            if podman --remote info >/dev/null 2>&1 || [ -S "${XDG_RUNTIME_DIR}/podman/podman.sock" ]; then
              echo "the Podman API socket is up at ${XDG_RUNTIME_DIR}/podman/podman.sock"
              exit 0
            fi
            sleep 1
          done
          echo "the Podman API socket did not appear"
          exit 1

      # spec/18-deployment.md §5.0 — Podman, not Docker.
      - name: Start the local stack
        # Only the broker and the database. A bare `up -d` also starts the
        # default-profile `message-store-service`, which consumes
        # `local-inthub-messagestore` and so steals the event the in-process
        # chain waits for (the run that reached that step timed out on
        # "the store event" after 361s).
        run: podman compose -f local/docker-compose.yml up -d sb-emulator sqledge

      # The emulator prints this line when it is ready to accept AMQP.
      # Polling the log is more reliable than polling the port: the port
      # opens before the broker will answer.
      - name: Wait for the Service Bus emulator
        run: |
          for _ in $(seq 1 60); do
            if podman logs ihb-rs-sb-emulator 2>&1 | grep -q 'Successfully Up'; then
              echo "the emulator is up"
              exit 0
            fi
            sleep 5
          done
          echo "the emulator did not start"
          podman logs ihb-rs-sb-emulator 2>&1 | tail -40
          exit 1

      - name: Wait for the database
        run: |
          for _ in $(seq 1 60); do
            if podman exec ihb-rs-sqledge bash -c 'exit 0' 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "the database did not start"
          podman logs ihb-rs-sqledge 2>&1 | tail -40
          exit 1

      # §9.2.1 — run in parallel, as `cargo test` runs everything else.
      # These tests are isolated by construction (a per-test session id, and
      # a lock on the shared non-session queue), so `--test-threads=1` is
      # deliberately NOT passed here: it would hide exactly the contention
      # that rule exists to prevent.
      #
      # `ihb-e2e` is excluded here, and run separately below. Its `compose`
      # feature (switched on by --all-features) makes each test tear down and
      # bring up a whole Compose profile on the one project, so two of them
      # in parallel, or one beside the stack this job already started, race
      # each other's `compose down` and fail (the first run that got this far
      # failed exactly so). They are one-at-a-time by design (CLAUDE.md;
      # spec/21 §2.2) and belong to tier 3, not to this parallel tier.
      - name: Emulator-backed tests
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'CI-only-Passw0rd!' }}
        run: cargo test --workspace --all-features --exclude ihb-e2e

      # The in-process chain: real services in this process against the
      # emulator, no Compose profile of its own, so it is safe beside the
      # stack above.
      - name: In-process end-to-end chain
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'CI-only-Passw0rd!' }}
        run: cargo test -p ihb-e2e --features emulator

      - name: Stack logs on failure
        if: failure()
        run: |
          podman logs ihb-rs-sb-emulator 2>&1 | tail -60
          podman logs ihb-rs-sqledge 2>&1 | tail -60

      - name: Stop the local stack
        if: always()
        run: podman compose -f local/docker-compose.yml down --volumes
