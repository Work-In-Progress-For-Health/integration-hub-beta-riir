  bus-watch:
    container_name: "ihb-rs-bus-watch"
    image: "ihb-rs/buswatch:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: buswatch
    env_file:
      - ./buswatch.env
    environment:
      # The Python's buswatch takes its host and port from its Dockerfile
      # `CMD` (`uvicorn --host 0.0.0.0 --port 8080`), so `buswatch.env`
      # sets neither and spec/02-configuration.md §9.1's defaults are the
      # laptop ones. In a container both have to be set, or it binds
      # loopback and nothing — including its own healthcheck — can reach
      # it. Found by bringing the profile up, not by reading the file.
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: on-failure
    healthcheck:
      # buswatch is a web service on `PORT`, not an `ihb-health` listener
      # on `HEALTH_CHECK_PORT`, so the probe is told which port to use.
      test: ["CMD", "/usr/local/bin/health-probe", "8080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - phw-to-mpi
      - lims-to-mpi
      - lims-to-trrr
      - paris-to-mpi
      - chemo-to-mpi
      - pims-to-mpi
      - mosaiq-to-mpi
      - mpi-to-topic
    networks:
      integration-hub:
        aliases:
          - "bus-watch"
  # §5.1's `dashboard` profile. The Cosmos emulator is copied from the
  # Python's compose unchanged; the dashboard itself is a Rust image, and
  # spec/15-dashboard.md §1.2 means it serves every page whether or not
  # this container is up.
  cosmos-emulator:
    container_name: "ihb-rs-cosmos-emulator"
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - "8081:8081"
      - "10250-10255:10250-10255"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: "3"
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    volumes:
      - "cosmos-data:/tmp/cosmos/appdata"
    restart: unless-stopped
    profiles:
      - dashboard
    networks:
      integration-hub:
        aliases:
          - "cosmos-emulator"

  dashboard:
    container_name: "ihb-rs-dashboard"
    image: "ihb-rs/dashboard:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: dashboard
    environment:
      # spec/02-configuration.md §9.2 — the container binds every
      # interface; the default is loopback, which is right on a laptop and
      # unreachable from outside a container.
      HOST: "0.0.0.0"
      PORT: "8000"
      COSMOS_ENDPOINT: "https://cosmos-emulator:8081"
      COSMOS_DISABLE_SSL_VERIFY: "true"
    ports:
      - "8000:8000"
    restart: on-failure
    healthcheck:
      # The dashboard serves HTTP, so §2.2's `/healthz` is the better
      # probe — but a distroless image has no `curl`. The TCP probe of
      # §3.1 answers the question a healthcheck asks: is it listening.
      test: ["CMD", "/usr/local/bin/health-probe", "8000"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    profiles:
      - dashboard
    networks:
      integration-hub:
        aliases:
          - "dashboard"

  # spec/20-lookup-service.md §10.2 — Phase 1, not production ready. The
  # Python's `lookup` profile also starts the Cosmos emulator; the Cosmos
  # store is not ported (§1.4), so this one serves the seed data compiled
  # into the binary, read-only: an upload is refused (`read_only`) until a
  # writable store exists.
  lookup-service:
    container_name: "ihb-rs-lookup-service"
    image: "ihb-rs/lookup-service:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: lookup-service
    env_file:
      - ./lookup-service.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    volumes:
      # The PIMS translation table (spec/20-lookup-service.md §7.5); replaces
      # the compiled-in seed for local runs, as upstream mounts it.
      - "./lookup-seed:/seed:ro"
    ports:
      - "127.0.0.1:8090:8080"
    restart: on-failure
    healthcheck:
      # A web service on `PORT`; a distroless image has no `curl`, so the TCP
      # probe stands in for `/health/ready`.
      test: ["CMD", "/usr/local/bin/health-probe", "8080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    profiles:
      - lookup
      - pims-to-mpi
    networks:
      integration-hub:
        aliases:
          - "lookup-service"


networks:
  integration-hub:
    driver: bridge

volumes:
  cosmos-data:
