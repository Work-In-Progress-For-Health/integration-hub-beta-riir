      args:
        BIN: hl7-chemo-transformer
    env_file:
      - ./chemo-hl7-transformer.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - chemo-to-mpi
    networks:
      integration-hub:
        aliases:
          - "chemo-hl7-transformer"

  pims-hl7-server:
    container_name: "ihb-rs-pims-hl7-server"
    image: "ihb-rs/hl7-server:${IHB_TAG:-dev}"
    build:
      context: ..
