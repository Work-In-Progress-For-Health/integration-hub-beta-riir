    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - phw-to-mpi
    networks:
      integration-hub:
        aliases:
          - "phw-hl7-server"

  hl7-soap-server:
