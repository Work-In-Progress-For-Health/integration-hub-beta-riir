# Local development stack, run with Podman.
#
#   podman compose -f local/docker-compose.yml --profile <name> up -d
#
# See spec/18-deployment.md §5. The filename stays `docker-compose.yml`
# because that is what every compose tool looks for; `podman compose` is a
# thin wrapper that runs the installed compose provider against the Podman
# socket.
#
# Profiles arrive as their services do; see tasks.md P9.2. Today this is the
# infrastructure the tests need: the Service Bus emulator and its backing
# store, plus SQL Server for the message store and replay job.

name: integration-hub-rust

services:
  sb-emulator:
    container_name: "ihb-rs-sb-emulator"
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - "./ServiceBusEmulatorConfig.json:/ServiceBus_Emulator/ConfigFiles/Config.json:z"
    ports:
      - "5672:5672"
    restart: on-failure
    environment:
      SQL_SERVER: sqledge
      ACCEPT_EULA: "Y"
    env_file:
      - ./.secrets
    depends_on:
      - sqledge
    networks:
      integration-hub:
        aliases:
          - "sb-emulator"

  # Azure SQL Edge, not SQL Server. Edge ships an arm64 image and
  # `mcr.microsoft.com/mssql/server` does not, so on an Apple Silicon
  # machine this is the only one that runs — the `sqlserver` service below
  # segfaults under emulation. See spec/18-deployment.md §5.3.
  sqledge:
    container_name: "ihb-rs-sqledge"
    image: "mcr.microsoft.com/azure-sql-edge:latest"
    restart: on-failure
    ports:
      # Published so `ihb-sql`'s tests can reach it from the host.
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
    env_file:
      - ./.secrets
    networks:
      integration-hub:
        aliases:
          - "sqledge"
          # `message-store-service.env` and `message-replay-job.env` both
          # set `SQL_SERVER=sqlserver`, and spec/18-deployment.md §5.2
          # requires those files to be used **unchanged**. On arm64 the
          # `sqlserver` service cannot run at all (§5.3.2), so the name is
          # aliased onto Edge here — the env file stays byte-identical to
          # the Python's and the name still resolves.
          - "sqlserver"

  sqlserver:
    container_name: "ihb-rs-sqlserver"
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sql"]
    restart: on-failure
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    env_file:
      - ./.secrets
    networks:
      integration-hub:
        aliases:
          - "sqlserver"

  # ---------------------------------------------------------------------
  # The services, mirroring the Python's compose profile for profile
  # (spec/18-deployment.md §5.1). Each name matches the Python service it
  # replaces, so the `.env` files of §5.2 are used unchanged and a mixed
  # stack (§5.5) is a matter of which compose file a container comes from.
  #
  # `container_name` is prefixed `ihb-rs-` so a Rust container and its
  # Python counterpart can run side by side during a cutover; the network
  # alias is the plain name, so neither has to know which it is talking to.
  # ---------------------------------------------------------------------

  message-store-service:
    container_name: "ihb-rs-message-store-service"
    image: "ihb-rs/message-store-service:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: message-store-service
    env_file:
      - ./.secrets
      - ./message-store-service.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
      - sqledge
    networks:
      integration-hub:
        aliases:
          - "message-store-service"

  message-replay-job:
    container_name: "ihb-rs-message-replay-job"
    image: "ihb-rs/message-replay-job:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: message-replay-job
    env_file:
      - ./.secrets
      - ./message-replay-job.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
      - sqledge
    profiles:
      - replay
    networks:
      integration-hub:
        aliases:
          - "message-replay-job"

  phw-hl7-server:
    container_name: "ihb-rs-phw-hl7-server"
    image: "ihb-rs/hl7-server:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-server
    env_file:
      - ./phw-hl7-server.env
    ports:
      - "2575:2575"
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - phw-to-mpi
    networks:
      integration-hub:
        aliases:
          - "phw-hl7-server"

  hl7-soap-server:
    container_name: "ihb-rs-hl7-soap-server"
    image: "ihb-rs/hl7-soap-server:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-soap-server
    env_file:
      - ./lims-soap-hl7-server.env
    ports:
      - "8082:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - lims-to-mpi
      - lims-to-wrrs
      - lims-to-trrr
    networks:
      integration-hub:
        aliases:
          - "hl7-soap-server"

  # The REST ingress, configured as hl7-soap-server (spec/19-rest-servers.md
  # §9). One profile, ingress only: its egress topic is the LIMS one, so run it
  # alone against the emulator rather than beside `lims-to-mpi`, which would
  # put two servers on one topic.
  rest-server:
    container_name: "ihb-rs-rest-server"
    image: "ihb-rs/rest-server:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: rest-server
    env_file:
      - ./rest-server-lims.env
    ports:
      - "8083:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - rest-server
    networks:
      integration-hub:
        aliases:
          - "rest-server"

  phw-hl7-transformer:
    container_name: "ihb-rs-phw-hl7-transformer"
    image: "ihb-rs/hl7-phw-transformer:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-phw-transformer
    env_file:
      - ./phw-hl7-transformer.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - phw-to-mpi
    networks:
      integration-hub:
        aliases:
          - "phw-hl7-transformer"

  mpi-hl7-sender:
    container_name: "ihb-rs-mpi-hl7-sender"
    image: "ihb-rs/hl7-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-sender
    env_file:
      - ./mpi-hl7-sender.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - phw-to-mpi
      - chemo-to-mpi
    networks:
      integration-hub:
        aliases:
          - "mpi-hl7-sender"

  # Dedicated senders for the flows that moved from the shared
  # `local-inthub-mpi-sender-ingress` queue to a topic of their own
  # (spec/01-architecture.md §2.1.3; upstream 9e797ac, 7157ee3, 2b26c7f).
  # Each is `hl7-sender` with subscription ingress, delivering to the topic
  # mock receiver, and reads nothing else, so two flows never contend for
  # one session.
  paris-mpi-hl7-sender:
    container_name: "ihb-rs-paris-mpi-hl7-sender"
    image: "ihb-rs/hl7-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-sender
    env_file:
      - ./paris-mpi-hl7-sender.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - paris-to-mpi
    networks:
      integration-hub:
        aliases:
          - "paris-mpi-hl7-sender"

  # PIMS moved from the shared queue to its own topic (spec/09-transformers.md
  # §5.12; upstream 04b30e7, #427).
  pims-mpi-hl7-sender:
    container_name: "ihb-rs-pims-mpi-hl7-sender"
    image: "ihb-rs/hl7-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-sender
    env_file:
      - ./pims-mpi-hl7-sender.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - pims-to-mpi
    networks:
      integration-hub:
        aliases:
          - "pims-mpi-hl7-sender"

  mosaiq-mpi-hl7-sender:
    container_name: "ihb-rs-mosaiq-mpi-hl7-sender"
    image: "ihb-rs/hl7-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-sender
    env_file:
      - ./mosaiq-mpi-hl7-sender.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - mosaiq-to-mpi
    networks:
      integration-hub:
        aliases:
          - "mosaiq-mpi-hl7-sender"

  # The RISP profile holds only its sender in this stack: the REST server
  # and the core-reference transformer have env files (`rest-server-risp.env`)
  # but no service yet, so nothing publishes to this topic locally.
  risp-mpi-hl7-sender:
    container_name: "ihb-rs-risp-mpi-hl7-sender"
    image: "ihb-rs/hl7-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-sender
    env_file:
      - ./risp-mpi-hl7-sender.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - risp-to-mpi
    networks:
      integration-hub:
        aliases:
          - "risp-mpi-hl7-sender"

  # Generic db-sender configured for RISP -> WRRS (spec/10-senders.md section 7; upstream #422, #433).
  # `.secrets` supplies MSSQL_SA_PASSWORD. The DRS database is created by
  # `sql/init-drs-db.sql`, which nothing applies on start-up (no sqlcmd in Edge).
  wrrs-stmsg-dbsender:
    container_name: "ihb-rs-wrrs-stmsg-dbsender"
    image: "ihb-rs/db-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: db-sender
    env_file:
      - ./wrrs-stmsg-dbsender.env
      - ./.secrets
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
      - sqledge
    profiles:
      - risp-to-wrrs
    networks:
      integration-hub:
        aliases:
          - "wrrs-stmsg-dbsender"

  # WPAS -> PROMS ingress (spec/19-rest-servers.md section 9): the generic REST
  # pipeline taking the WPAS XML as it is and writing the WPAS topic.
  wpas-rest-server:
    container_name: "ihb-rs-wpas-rest-server"
    image: "ihb-rs/rest-server:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: rest-server
    env_file:
      - ./wpas-rest-server.env
    ports:
      - "127.0.0.1:8084:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - wpas-to-proms
    networks:
      integration-hub:
        aliases:
          - "wpas-rest-server"

  # Consumes the WPAS topic subscription, builds the FHIR message Bundle and
  # queues it for fhir-sender (spec/16-proms-transformer.md).
  proms-fhir-transformer:
    container_name: "ihb-rs-proms-fhir-transformer"
    image: "ihb-rs/xml-fhir-proms-transformer:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: xml-fhir-proms-transformer
    env_file:
      - ./proms-fhir-transformer.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - wpas-to-proms
    networks:
      integration-hub:
        aliases:
          - "proms-fhir-transformer"

  # WPAS -> PROMS egress (spec/10-senders.md section 8): consumes the session-enabled
  # queue the PROMs transformer writes and delivers Bundles to the Promptly mock.
  fhir-sender:
    container_name: "ihb-rs-fhir-sender"
    image: "ihb-rs/fhir-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: fhir-sender
    env_file:
      - ./fhir-sender.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
      - promptly-mock-receiver
    profiles:
      - wpas-to-proms
    networks:
      integration-hub:
        aliases:
          - "fhir-sender"

  # Mock of the Promptly $process-message async API (spec/11-mock-receivers.md section 3.10).
  # Bundle.id selects a scenario (mock-400, mock-429-once, ...).
  promptly-mock-receiver:
    container_name: "ihb-rs-promptly-mock-receiver"
    image: "ihb-rs/http-mock-receiver:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: http-mock-receiver
    env_file:
      - ./promptly-mock-receiver.env
    ports:
      - "127.0.0.1:8085:8080"
    restart: on-failure
    depends_on:
      - sb-emulator
    profiles:
      - wpas-to-proms
    networks:
      integration-hub:
        aliases:
          - "promptly-mock-receiver"

  # Dedicated LIMS -> MPI sender (spec/18-deployment.md §5.2.3): subscription ingress from
  # the topic hl7-soap-server publishes to, delivering to the topic mock receiver. It
  # replaces the shared queue-based mpi-hl7-sender in this profile, which nothing fed.
  lims-mpi-hl7-sender:
    container_name: "ihb-rs-lims-mpi-hl7-sender"
    image: "ihb-rs/hl7-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-sender
    env_file:
      - ./lims-mpi-hl7-sender.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - lims-to-mpi
    networks:
      integration-hub:
        aliases:
          - "lims-mpi-hl7-sender"

  # Classifies LIMS A31/A40 and fans out one message per matching rule to
  # local-inthub-lims-wrrs-classified (spec/09-transformers.md section 10). Its own profile,
  # fed by hl7-soap-server publishing to the LIMS topic.
  lims-wrrs-hl7-transformer:
    container_name: "ihb-rs-lims-wrrs-hl7-transformer"
    image: "ihb-rs/hl7-lims-wrrs-transformer:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-lims-wrrs-transformer
    env_file:
      - ./lims-wrrs-hl7-transformer.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - lims-to-wrrs
    networks:
      integration-hub:
        aliases:
          - "lims-wrrs-hl7-transformer"

  # Dedicated LIMS -> TRRR sender (upstream #429): a second subscription on the LIMS topic,
  # delivering to the topic mock receiver locally.
  lims-trrr-hl7-sender:
    container_name: "ihb-rs-lims-trrr-hl7-sender"
    image: "ihb-rs/hl7-sender:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-sender
    env_file:
      - ./lims-trrr-hl7-sender.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - lims-to-trrr
    networks:
      integration-hub:
        aliases:
          - "lims-trrr-hl7-sender"

  mpi-hl7-mock-receiver:
    container_name: "ihb-rs-mpi-hl7-mock-receiver"
    image: "ihb-rs/hl7-mock-receiver:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-mock-receiver
    env_file:
      - ./mpi-hl7-mock-receiver.env
    ports:
      - "2576:2576"
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - phw-to-mpi
      - chemo-to-mpi
      - pims-to-mpi
      - mpi-to-topic
    networks:
      integration-hub:
        aliases:
          - "mpi-hl7-mock-receiver"

  # The topic mock receiver: where the dedicated senders deliver
  # (spec/11-mock-receivers.md §5). Its port is not published, because
  # `mpi-hl7-chemo-sender` publishes 2581 on the host; containers reach it
  # by alias on the network.
  mpi-hl7-topic-mock-receiver:
    container_name: "ihb-rs-mpi-hl7-topic-mock-receiver"
    image: "ihb-rs/hl7-topic-mock-receiver:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-topic-mock-receiver
    env_file:
      - ./mpi-hl7-topic-mock-receiver.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - paris-to-mpi
      - mosaiq-to-mpi
      - risp-to-mpi
    networks:
      integration-hub:
        aliases:
          - "mpi-hl7-topic-mock-receiver"

  cav-paris-hl7-server:
    container_name: "ihb-rs-cav-paris-hl7-server"
    image: "ihb-rs/hl7-server:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-server
    env_file:
      - ./cav-paris-hl7-server.env
    ports:
      - "2577:2577"
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - paris-to-mpi
    networks:
      integration-hub:
        aliases:
          - "cav-paris-hl7-server"

  mosaiq-hl7-server:
    container_name: "ihb-rs-mosaiq-hl7-server"
    image: "ihb-rs/hl7-server:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-server
    env_file:
      - ./mosaiq-hl7-server.env
    ports:
      - "2583:2583"
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - mosaiq-to-mpi
    networks:
      integration-hub:
        aliases:
          - "mosaiq-hl7-server"

  chemo-hl7-server:
    container_name: "ihb-rs-chemo-hl7-server"
    image: "ihb-rs/hl7-server:${IHB_TAG:-dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BIN: hl7-server
    env_file:
      - ./chemo-hl7-server.env
    ports:
      - "2578:2578"
    restart: on-failure
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - sb-emulator
    profiles:
      - chemo-to-mpi
    networks:
      integration-hub:
        aliases:
          - "chemo-hl7-server"

  chemo-hl7-transformer:
    container_name: "ihb-rs-chemo-hl7-transformer"
    image: "ihb-rs/hl7-chemo-transformer:${IHB_TAG:-dev}"
    build:
      context: ..
